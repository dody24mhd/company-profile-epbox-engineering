<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex,nofollow">
	<meta http-equiv="Permissions-Policy" content="interest-cohort=()">
	<title></title>

	<!-- jQuery -->
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>

	<!-- HTML and Javascript framework https://get.foundation/sites/docs/ -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.7.5/dist/css/foundation.min.css"
		crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/foundation-sites@6.7.5/dist/js/foundation.min.js"
		crossorigin="anonymous"></script>

	<!-- Icons https://fontawesome.com -->
	<script src="https://kit.fontawesome.com/656c940340.js" crossorigin="anonymous"></script>

	<!-- Basic CSS -->
	<link rel="stylesheet" href="css/style.css">
</head>

<body id="body" data-toggler=".dark" class="dark background condensed">
	<div>
		<div class="main">
			<div class="vcard">
				<div class="grid-x grid-padding-x align-center">
					<div class="cell shrink align-self-middle">
						<div class="head">
							<a href="vcard/vcard-dody.vcf" id="vcard-link" class="vcard-link is-hidden">
								<i class="fa-solid fa-address-card fa-lg"></i>
							</a>
							<span id="qrcode-link" data-toggle="avatar qrcode body" data-toggler=".is-hidden"
								class="qrcode-link is-hidden">
								<i class="fa-solid fa-qrcode fa-lg"></i>
							</span>
							<img src="logowhite.png" id="logo" class="logo" alt="Logo">
							<div id="round" data-toggler=".text" class="round">
								<img src="images/dody.webp" id="avatar" data-toggler=".is-hidden" class="avatar">

								<img src="qrcode.png" id="qrcode" data-toggle="avatar body qrcode"
									data-toggler=".is-hidden" class="qrcode is-hidden">
								<!-- end -->


							</div>

							<span id="url" class="url is-hidden">
								<span class="employee-id">EP-000-12</span>
							</span>
						</div>
					</div>
					<div class="cell medium-auto align-self-middle">
						<h1 id="name" class="name is-hidden">
							<span data-toggle="fn nickname" id="fn" data-toggler=".is-hidden" class="fn"></span>
							<span id="nickname" data-toggle="nickname fn" data-toggler=".is-hidden"
								class="nickname is-hidden"></span>
							<small class="is-hidden" id="org" class="org"></small>
						</h1>
						<div id="tel" class="tel is-hidden">
							<a href="tel:"></a>
						</div>
						<div id="email" class="email is-hidden">
							<a href="mailto:"></a>
						</div>
						<div id="social" class="social">
							<a href="mailto:sales@epbox-engg.com" target="_blank" title="Email" id="Email">
								<i class="fa-solid fa-envelope fa-lg"></i>
							</a>
							<a href="//wa.me/6281170088989" target="_blank" title="WhatsApp" id="whatsapp">
								<i class="fa-brands fa-whatsapp fa-lg"></i>
							</a>
							<a href="https://www.instagram.com/epboxengg/" target="_blank" title="Instagram"
								id="instagram">
								<i class="fa-brands fa-instagram fa-lg"></i>
							</a>
							<a href="https://www.linkedin.com/company/epbox-engineering" target="_blank"
								title="LinkedIn" id="linkedin">
								<i class="fa-brands fa-linkedin fa-lg"></i>
							</a>
						</div>
						<div class="copyright-bottom">© 2026 | EPBOX ENGINEERING PTE. LTD.</div>

					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		// Initial Foundation framework
		$(document).foundation();
	</script>

	<!-- Basic Javascript -->
	<script src="js/script.js"></script>

</body>

</html>
